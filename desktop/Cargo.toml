[package]
name = "labbench"          # gpui-kit-фронтенд: осциллограф + спектр + LCR + Z-метр
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
# Отдельный workspace: embedded-прошивка (thumbv7em) и десктоп не должны
# пересекаться ни тулчейном, ни фичами.

[dependencies]
# gpui-kit — «один crate для всего»: реэкспортит gpui (Zed UI), gpui-base
# и gpui-component (кнопки/слайдеры/вкладки). Пиньте точную версию:
# снапшоты GPUI (`gpui-pre-*`) меняют API еженедельно.
gpui-kit = { version = "=0.7.1", features = ["component", "assets"] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- DSP / измерения -------------------------------------------------------
rustfft = "6"              # FFT для анализатора спектра (real-to-complex)
num-complex = "0.4"        # комплексные отсчёты для LCR / Z-метра

# --- Транспорт (протокол v2, см. src/main.rs прошивки) --------------------
# Кадр данных: AA 55 <flags> <seq:u8> <nch> <per-ch u16 LE>; команды: 0xA0+
serialport = "4"           # cross-platform (ttyACM/ttyUSB/COMx)
crossbeam-channel = "0.5"  # lock-free канал reader-потока в UI

clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
