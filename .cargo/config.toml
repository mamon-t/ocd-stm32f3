[build]
# Целевая плата: STM32F303VCT6 — Cortex-M4 БЕЗ FPU.
# Правильный target: thumbv7em-none-eabi (не eabihf! — иначе rustc ищет
# non-existent rust-std для eabihf на этом чипе, отсюда "can't find crate for core").
target = "thumbv7em-none-eabi"

[target.thumbv7em-none-eabi]
# Указываем скрипт линковки для embedded
# ВАЖНО: "-Tdefmt.x" обязателен — этот скрипт линковки crate defmt
# (PROVIDE(_defmt_panic = ...)). Без него embassy с фичей "defmt" не слинкуется:
# "undefined symbol: _defmt_panic". Порядок: сначала defmt.x, затем link.x.
rustflags = [
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=-Tlink.x",
]

# Опционально: если ты используешь probe-rs для прошивки (рекомендуется вместо старого probe-run)
# runner = "probe-rs run --chip STM32F303VC"

# objcopy не обязателен: probe-rs работает с .elf напрямую.
# Если нужен .bin для stm32flash/DFU — см. README (arm-none-eabi-objcopy).