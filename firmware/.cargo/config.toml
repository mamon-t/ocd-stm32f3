[build]
# Целевая плата: STM32F303VCT6 — Cortex-M4F (FPU есть).
# Target: thumbv7em-none-eabi (soft-float). Это осознанный выбор: FPU в прошивке
# не используется, а soft-float убирает зависимость от RET-инструкций/регистров FPU.
target = "thumbv7em-none-eabi"

[target.thumbv7em-none-eabi]
# Указываем скрипт линковки для embedded
# ВАЖНО: "-Tdefmt.x" обязателен — этот скрипт линковки crate defmt
# (PROVIDE(_defmt_panic = ...)). Без него embassy с фичей "defmt" не слинкуется:
# "undefined symbol: _defmt_panic". Порядок: сначала defmt.x, затем link.x.
rustflags = [
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=-Tlink.x",
]

# probe-rs: прошивка + запуск + RTT-логи одной командой.
# ВАЖНО: "--scan-region ram" обязателен для probe-rs 0.32 — без него probe-rs
# не сканирует RAM и не опрашивает RTT, поэтому логов не будет вообще.
runner = "probe-rs run --chip STM32F303VC --scan-region ram"

# objcopy не обязателен: probe-rs работает с .elf напрямую.
# Если нужен .bin для stm32flash/DFU — см. README (arm-none-eabi-objcopy).

[env]
# defmt 1.x гейтит макросы info!/debug!/trace! НА ЭТАПЕ КОМПИЛЯЦИИ по значению
# переменной DEFMT_LOG (по умолчанию "error"). Без неё все info!-логи вырезаются
# из бинарника и RTT остаётся пустым — даже при корректной прошивке.
DEFMT_LOG = "info"